<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Planificador | Tareas</title>
</head>

<body>
    <!-- =================================================================================
                                    HEADER/NAVBAR
     ================================================================================= -->
    <header id="navbar">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Dropdown
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <aside>
            <!-- EN CONSTRUCCIÓN -->
        </aside>
        <div class="contenedor">
            <div class="title">
                <h1>Planificador de Tareas</h1>
            </div>
            <div class="paneles">
                <!-- PANEL IZQUIERDO -->
                <div class="task-form">
                    <!-- NOMBRE DE LA TAREA -->
                    <div class="mb-3">
                        <input type="text" class="form-control" id="task-name"
                            placeholder="Titulo de la Tarea">
                    </div>
                    <div class="checkbox">
                        <!-- CATEGORIA -->
                        <select class="form-select categoria" aria-label="Default select example">
                            <option selected disabled>Categoria</option>
                            <option value="estudio">Estudio</option>
                            <option value="trabajo">Trabajo</option>
                            <option value="hogar">Hogar</option>
                        </select>
                        <!-- ESTADO -->
                        <select class="form-select" size="3" aria-label="Size 3 select example">
                            <option selected disabled>Prioridad</option>
                            <option value="1">Baja</option>
                            <option value="2">Media</option>
                            <option value="3">Alta</option>
                        </select>
                    </div>
                    <!-- DESCRIPCION DE LA TAREA -->
                    <div class="mb-3" id="task-text">
                        <textarea class="form-control task-text" placeholder="Descripción"></textarea>
                    </div>
                    <div class="form-bottom">
                        <!-- FECHAS -->
                        <input type="date" class="form-control">
                        <input type="date" class="form-control">
                        <!-- AGREGAR TAREA -->
                        <input class="btn btn-primary" type="submit" value="Submit">
                    </div>
                </div>
                <!-- PANEL DERECHO -->
                <div class="to-do-list">
                    <!-- LISTA DE TAREAS -->
                    <ul class="list-group">
                        <li class="list-group-item">
                            <!-- CHECKLIST -->
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" value="" id="tarea" switch>
                            </div><span>Crear popUP de detalles</span>
                            <!-- MÁS DETALLES -->
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Opciones</option>
                                <option value="1">Por Hacer</option>
                                <option value="2">En Progreso</option>
                                <option value="3">Finalizado</option>
                            </select>
                            <!-- BOTÓN DETALLES -->
                            <button type="button" class="btn btn-secondary btn-sm">Detalles</button>
                        </li>
                        <li class="list-group-item">
                            <!-- CHECKLIST -->
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" value="" id="tarea" switch>
                            </div><span>Preparar Presentación</span>
                            <!-- MÁS DETALLES -->
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Opcioness</option>
                                <option value="1">Por hacer</option>
                                <option value="2">En Progreso</option>
                                <option value="3">Finalizado</option>
                            </select>
                            <!-- BOTÓN Detalles -->
                            <button type="button" class="btn btn-secondary btn-sm">Detalles</button>
                        </li>
                        <li class="list-group-item">
                            <!-- CHECKLIST -->
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" value="" id="tarea" switch>
                            </div><span>Lavar Ropa</span>
                            <!-- MÁS DETALLES -->
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Opciones</option>
                                <option value="1">Por hacer</option>
                                <option value="2">En Progreso</option>
                                <option value="3">Finalizado</option>
                            </select>
                            <!-- BOTÓN Detalles -->
                            <button type="button" class="btn btn-secondary btn-sm">Detalles</button>
                        </li>
                        <li class="list-group-item">
                            <!-- CHECKLIST -->
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" value="" id="tarea" switch>
                            </div><span>Subir cambios a Github</span>
                            <!-- MÁS DETALLES -->
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Opcioness</option>
                                <option value="1">Por hacer</option>
                                <option value="2">En Progreso</option>
                                <option value="3">Finalizado</option>
                            </select>
                            <!-- BOTÓN Detalles -->
                            <button type="button" class="btn btn-secondary btn-sm">Detalles</button>
                        </li>
                        <li class="list-group-item">
                            <!-- CHECKLIST -->
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" value="" id="tarea" switch>
                            </div><span>Limpiar la habitación</span>
                            <!-- MÁS DETALLES -->
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Opciones</option>
                                <option value="1">Por hacer</option>
                                <option value="2">En Progreso</option>
                                <option value="3">Finalizado</option>
                            </select>
                            <!-- BOTÓN Detalles -->
                            <button type="button" class="btn btn-secondary btn-sm">Detalles</button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
